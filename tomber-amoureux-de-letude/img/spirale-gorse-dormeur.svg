<text x="346.6" y="352.6" text-anchor="middle" fill="#1f4a3c" font-family="Outfit, 'Segoe UI', sans-serif" font-weight="600" font-size="11.5">v. 14 ; chute v. 13 et 14</text><path d="M 453.7 414.9 L 463.7 416.9" fill="none" stroke="#1f4a3c" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="463.7" y="396.9" width="250" height="118" rx="12" fill="#efe6d6"/><text x="477.7" y="418.9" text-anchor="start" fill="#c2543a" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="18" font-style="italic">5. Je trouve le sens</text><text x="477.7" y="438.9" text-anchor="start" fill="#1b1916" font-family="Outfit, 'Segoe UI', sans-serif" font-weight="500" font-size="12.5">Problème : un paysage de vie</text><text x="477.7" y="454.9" text-anchor="start" fill="#1b1916" font-family="Outfit, 'Segoe UI', sans-serif" font-weight="500" font-size="12.5">qui fait éprouver une mort.</text><text x="477.7" y="474.9" text-anchor="start" fill="#1b1916" font-family="Outfit, 'Segoe UI', sans-serif" font-weight="500" font-size="12.5">On peut défendre : du repos</text><text x="477.7" y="490.9" text-anchor="start" fill="#1b1916" font-family="Outfit, 'Segoe UI', sans-serif" font-weight="500" font-size="12.5">apparent à une mort violente.</text><text x="477.7" y="506.9" text-anchor="start" fill="#6d655c" font-family="Outfit, 'Segoe UI', sans-serif" font-weight="500" font-size="11.5">Limite : pas les convictions de Rimbaud.</text>
