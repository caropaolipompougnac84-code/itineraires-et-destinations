<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="spirale-title spirale-desc">
  <title id="spirale-title">La spirale de Gorse</title>
  <desc id="spirale-desc">Spirale lisse en quatre tours, large au départ, qui se resserre jusqu’à « Je trouve le sens ». On part de ce qui saute aux yeux, sous le nom « Je remarque », puis : je repère ; je comprends ; j’anticipe. L’idée s’écrit du côté extérieur, les appuis du côté intérieur.</desc>
