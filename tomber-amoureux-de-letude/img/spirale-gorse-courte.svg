<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" role="img" aria-labelledby="court-title court-desc">
  <title id="court-title">La spirale de Gorse, version courte</title>
  <desc id="court-desc">Spirale lisse en trois tours : je remarque, je comprends, j’anticipe, puis « Je trouve le sens ». On part de ce qui saute aux yeux. L’idée s’écrit du côté extérieur, les appuis du côté intérieur.</desc>
